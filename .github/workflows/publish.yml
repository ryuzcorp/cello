# Publish Cello images and release tarballs from annotated tags. A tag
# `v<semver>` (e.g. `v0.1.0`, `v0.2.0-beta.1`) publishes the multi-arch
# image `ghcr.io/ryuzcorp/cello:<version>` plus the `cello-<version>-linux-<arch>`
# release tarballs copied out of the pushed per-arch images, so the
# tarball bytes provably equal the tested image contents.
#
#   `verify`   the tag is annotated, names a valid semver whose version
#              exactly matches `crates/cello/Cargo.toml`, points at a
#              commit on `main` (reachable from `origin/main`), and carries
#              a passing `ci-ok` check from the `ci` workflow on that exact
#              commit (native CI covers the suite and clippy; the image no
#              longer re-runs them, so this gate is what keeps "what ships
#              was tested")
#   `push`     per architecture: refuse an already-published `<version>`
#              (only a confirmed "not found" lets it publish), then build
#              the release image (no test stage) and push it by digest
#              only (no arch tags, so no namespace collision), record
#              its digest, and package the matching release tarball by
#              copying the binary and license files out of that digest
#   `publish`  in this order, so that a failure before the release can be
#              retried on the same tag instead of costing a version:
#                1. stitch the immutable `<version>` index from this run's
#                   validated arch digests and push it
#                2. attest SLSA provenance for the index digest, then for
#                   the release tarballs and SHA256SUMS (each arch build
#                   also records provenance and an SBOM)
#                3. move the channel tags -- `beta` always, `<major>.<minor>`
#                   and `latest` for non-prereleases only -- as carbon
#                   copies of the attested index
#                4. create the GitHub Release with the tarballs and
#                   SHA256SUMS
#              and print the index digest and the attestation verify
#              commands to the step summary
#
# `<version>` itself is published by step 1 and can be pulled before the
# Release exists; what waits for both attestations is everything a consumer
# follows: no channel tag moves and no Release is created before step 3, and
# the Release comes last. A failure before step 3 therefore leaves the channel
# tags and the Release untouched, so the run is retried with "Re-run failed
# jobs" (not "Re-run all jobs": `push` still refuses an already-published
# `<version>`, and it does not re-run when only `publish` failed). A failure
# inside step 3 can leave the channel tags that already moved -- each of them
# already the attested index -- and no Release; the retry re-runs the same
# carbon copies and finishes. Channel tags only ever move forward, so a retry
# of an older version leaves a channel that already holds a newer version
# alone.
#
# The retry runs `scripts/publish-release.sh stitch` again against the
# artifacts the first attempt uploaded, which accepts the existing `<version>`
# only when it is exactly the index this run stitches from its own arch
# digests; anything else is refused.
#
# A published `<version>` is never overwritten and a published Release is
# never replaced: once the release exists, a run refuses and the only
# recovery is a new tag.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Read the `ci` workflow runs for the tagged commit (the CI gate).
      actions: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Check the tag against the tree and main
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag names the release: v<semver> (stable or prerelease).
          # Build metadata (+...) is refused outright: Docker tags forbid
          # '+', so such a version could never publish.
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?'
          if [[ ${GITHUB_REF_NAME} =~ ^v${semver}$ ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            echo "refusing tag $GITHUB_REF_NAME: want v<semver>" >&2
            exit 1
          fi
          # A release is an annotated tag (tagger + message). Asked
          # of the API rather than the checkout, whose tag refs may not keep
          # the tag object.
          kind=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          if [ "$kind" != "tag" ]; then
            echo "refusing tag $GITHUB_REF_NAME: a release must be an annotated tag, got $kind" >&2
            exit 1
          fi
          sha=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          # The tree must agree it is this version.
          cargo_version=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version = "/{gsub(/"/,"");print $3;exit}' crates/cello/Cargo.toml)
          if [ "$cargo_version" != "$version" ]; then
            echo "refusing tag $GITHUB_REF_NAME: crates/cello/Cargo.toml says $cargo_version" >&2
            exit 1
          fi
          # The tagged commit must sit on main, so a tag on a side
          # branch can never publish this name.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "refusing tag $GITHUB_REF_NAME: $sha is not on origin/main" >&2
            exit 1
          fi
          # The tagged commit must have a successful `ci` workflow run from
          # its `main` push. Native CI tests and lints every main commit and
          # the image no longer re-runs the suite, so without this gate a
          # tag could ship an untested tree. The gate asks the Actions
          # workflow-runs API for this repository's own `ci.yml`, never a
          # check run by name: any app with `checks: write` can create a
          # check run called `ci-ok`, but only GitHub Actions running this
          # file produces a run here. The run's own `ci-ok` job must have
          # passed too.
          command -v jq >/dev/null 2>&1 || { echo "refusing: jq is required" >&2; exit 1; }
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$sha\" and .path == \".github/workflows/ci.yml\" and .event == \"push\" and .head_branch == \"main\" and .conclusion == \"success\")] | first | .id // empty")
          if [ -z "$run_id" ]; then
            echo "refusing tag $GITHUB_REF_NAME: no successful ci run for the main push of $sha" >&2
            exit 1
          fi
          gate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "ci-ok" and .conclusion == "success")] | length')
          if [ "${gate:-0}" -eq 0 ]; then
            echo "refusing tag $GITHUB_REF_NAME: ci run $run_id has no passing ci-ok job" >&2
            exit 1
          fi
          echo "ci run $run_id passed on $sha (ci-ok green)"
          prerelease="false"
          if [[ $version == *-* ]]; then
            prerelease="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag $GITHUB_REF_NAME is $sha on origin/main (prerelease: $prerelease)"

  push:
    name: Build and push (${{ matrix.suffix }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux/amd64, suffix: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, suffix: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      # Registry cache export needs the docker-container driver.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        id: build
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/ryuzcorp/cello"
          sha=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          # Only a confirmed "not found" lets a version publish: any other
          # inspect failure (auth, registry outage) stops the run, and a
          # published <version> is never overwritten.
          if found=$(docker buildx imagetools inspect "$image:$VERSION" 2>&1); then
            echo "$image:$VERSION is already published; cut a new tag" >&2
            exit 1
          elif ! grep -qiE 'not found|manifest unknown' <<<"$found"; then
            echo "cannot tell whether $image:$VERSION is published:" >&2
            echo "$found" >&2
            exit 1
          fi
          command -v jq >/dev/null 2>&1 || { echo "refusing: jq is required" >&2; exit 1; }
          cache="$image:buildcache-${{ matrix.suffix }}"
          # Push by digest only: no arch tags are published, so a release
          # tag can never collide with (or overwrite) a staging image.
          # The never-overwrite check above stays on <version>.
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg "CELLO_COMMIT=$sha" \
            --build-arg "CELLO_VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/ryuzcorp/cello" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$sha" \
            --provenance=mode=max \
            --sbom=true \
            --cache-from "type=registry,ref=$cache" \
            --cache-to "type=registry,ref=$cache,mode=max" \
            --metadata-file /tmp/cello-metadata.json \
            --output "type=image,name=$image,push-by-digest=true,name-canonical=true,push=true" \
            .
          # Pin the package step to this run's pushed digest, not any tag,
          # so the tarball cannot pick up anything pushed later.
          digest=$(jq -r '."containerimage.digest" // empty' /tmp/cello-metadata.json)
          hex="${digest#sha256:}"
          case "$digest" in sha256:*) ;; *) echo "refusing: bad arch digest: $digest" >&2; exit 1 ;; esac
          [ "${#hex}" -eq 64 ] || { echo "refusing: bad arch digest: $digest" >&2; exit 1; }
          case "$hex" in *[!0-9a-f]*) echo "refusing: bad arch digest: $digest" >&2; exit 1 ;; esac
          echo "arch-digest=$digest" >> "$GITHUB_OUTPUT"
          # The publish job stitches the index from this digest (via the
          # uploaded artifact), not from any tag.
          mkdir -p dist
          printf '%s' "$digest" > "dist/arch-digest-${{ matrix.suffix }}.txt"
      # The tarball is copied out of this run's pushed arch image (by digest),
      # so its bytes provably equal the image built from the CI-tested commit
      # (no second build).
      - name: Package the release tarball
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARCH_DIGEST: ${{ steps.build.outputs.arch-digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/ryuzcorp/cello"
          case "$ARCH_DIGEST" in sha256:*) ;; *) echo "refusing: bad arch digest" >&2; exit 1 ;; esac
          ref="$image@$ARCH_DIGEST"
          rm -rf stage
          mkdir -p stage dist
          docker pull --platform "${{ matrix.platform }}" "$ref"
          ctr=$(docker create --platform "${{ matrix.platform }}" "$ref")
          trap 'docker rm "$ctr" >/dev/null' EXIT
          docker cp "$ctr:/usr/local/bin/cello" stage/cello
          docker cp "$ctr:/usr/share/doc/cello/LICENSE" stage/LICENSE
          docker cp "$ctr:/usr/share/doc/cello/NOTICE" stage/NOTICE
          tarball="cello-$VERSION-linux-${{ matrix.suffix }}.tar.gz"
          tar -czf "dist/$tarball" -C stage cello LICENSE NOTICE
          (cd dist && sha256sum "$tarball" > "SHA256SUMS-${{ matrix.suffix }}")
          cat "dist/SHA256SUMS-${{ matrix.suffix }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/cello-*.tar.gz
            dist/SHA256SUMS-${{ matrix.suffix }}
            dist/arch-digest-${{ matrix.suffix }}.txt

  publish:
    name: Publish image, release and attestations
    needs: [verify, push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      # The publish steps run `scripts/publish-release.sh` from the tagged
      # tree, so a retry of this job runs the same logic the first attempt did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      # Publishes the immutable `<version>` index and nothing else: no channel
      # tag moves and no release is created until both attestations below
      # succeed. A retry accepts an existing `<version>` only when it is
      # exactly the index this run stitches from its own arch digests.
      - name: Stitch the version index
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/publish-release.sh stitch
      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/ryuzcorp/cello
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest release files
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/cello-*.tar.gz, dist/SHA256SUMS
      # Only now, with both attestations in place, do the channel tags move and
      # the GitHub Release appear, so a failure above leaves nothing a user can
      # pull on the new version.
      - name: Promote and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INDEX_DIGEST: ${{ steps.publish.outputs.digest }}
        run: scripts/publish-release.sh promote
